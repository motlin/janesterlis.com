onlyBuiltDependencies:
  - esbuild
  - sharp
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Astro bundles its own Vite, so unlike typescript-template there is no vite override here.
catalog:
  vitest: 5.0.0
  vite-plus: 0.3.3
allowBuilds:
  esbuild: true
  fallow: true
  sharp: true
  unrs-resolver: true
